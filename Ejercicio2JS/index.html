    <script>

        //Declare variables
        let nota1, nota2, nota3, nombreCompleto
        //Use prompt para pedir la info
        //y guarde las variables
        nota1 = Number (prompt ("ola, ingresa las variables vro"));
         nota2 = Number (prompt ("Aqui tambien hermano"));
           nota3 = Number (prompt ("Y aqui"));
        nombreCompleto = prompt ("Se me olvido preguntarte el nombre, ponelo aqui")

        //Realice la operando
         let promedio = (nota1*0.30) + (nota2*0.35) + (nota3*0.35);

        //Muestre el resultado con un document.write()
        document.write("La nota final de " + nombreCompleto + "es" + promedio);

    </script>
