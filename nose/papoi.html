<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <h1 id="texto">
        soy un h1
    </h1>

    <script>
        
        //declarar las variables

        let número1 , número2, sum;

        //Solicitar el valor de la variable
        número1 = Number( prompt ("Ingrese el número 1:"));

        número2 = Number( prompt ("Ingrese el  número 2: "));

//Sumar en la variable de sum
sum = número1 + número2

        //Meter el resultado en nuestro h1
        document.getElementById("texto").innerHTML = sum;
    </script>

</body>
</html>
